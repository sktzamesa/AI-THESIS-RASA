  utter_hiv_definition:
    - text: >
        **HIV stands for Human Immunodeficiency Virus.**

        It’s a virus that attacks the body’s immune system—specifically the CD4 cells (T cells), which help fight infections.

        **What HIV does**

        • HIV weakens your immune system over time 

        • If untreated, it can lead to AIDS (Acquired Immunodeficiency Syndrome), the most advanced stage of HIV infection 

        • At that stage, the body has a very hard time fighting off infections and diseases

  utter_hiv_vs_aids_difference:
    - text: >
        **The difference between HIV and AIDS is mainly about what they are and how advanced the condition is.**

        **HIV (Human Immunodeficiency Virus)**

        • The virus itself  

        • Attacks the immune system (CD4 cells)  

        • A person can live with HIV for many years  

        • May not show obvious symptoms  

        • Can be managed with proper treatment  

        **AIDS (Acquired Immunodeficiency Syndrome)**

        • Not a separate virus  

        • The most advanced stage of HIV infection  

        • Occurs when the immune system is severely damaged  

        • The body becomes vulnerable to serious infections and illnesses  

        **In simple terms:**

        • HIV is the cause (the virus)  

        • AIDS is the result (the late stage of untreated HIV) 

        **Important:**

        • With modern treatment, many people with HIV never develop AIDS at all

  utter_hiv_transmission:
    - text: >
        **How HIV spreads**

        HIV is transmitted when infected body fluids (blood, semen, vaginal or rectal fluids, or breast milk) enter another person’s body—usually through sex, needles, or from mother to child.

        **The main ways people get HIV**

        • Unprotected sex (vaginal or anal) with someone who has HIV  

        • Sharing needles or syringes  

        • Mother-to-child transmission (during pregnancy, birth, or breastfeeding)  

        • Rare cases: unsafe blood transfusions  

        **Key idea**

        • HIV needs a direct path into the body (like through mucous membranes or the bloodstream)  

        • It doesn’t just spread casually  

        **What does NOT spread HIV**

        • Hugging, kissing, or touching

        • Sharing food or drinks  

        • Air (coughing or sneezing)  
        
        • Insect bites  

  utter_hiv_not_transmitted:
    - text: >
        **HIV is NOT spread that way.**

        **Why not?**

        • HIV does not survive well outside the human body  

        • It is not present in enough amounts in saliva, sweat, or tears to infect someone  

        • It cannot travel through air or insects  

        **Key idea to remember**

        • HIV only spreads through specific body fluids entering the body (like during sex, blood exposure, or from mother to child)

        • It is not spread through everyday contact  

  utter_clarify_hiv_question:
    - text: >
        I can help with that 

        Do you mean:

